name: freedl-tools

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  maintenance:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install media tools on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install media tools on macOS
        if: runner.os == 'macOS'
        run: command -v ffmpeg || brew install ffmpeg
      - name: Install maintenance dependency
        run: python -m pip install mutagen==1.48.1
      - name: Build current backend
        run: |
          mkdir -p "$RUNNER_TEMP/freedl-validation"
          go build -o "$RUNNER_TEMP/freedl-validation/udl" ./cmd/udl
      - name: Verify context, preservation and native promotion
        run: |
          python .dev/freedl-0912/test_context.py
          python .dev/freedl-0912/test_quality.py
          UDL_FREEDL_TEST_BINARY="$RUNNER_TEMP/freedl-validation/udl" python .dev/freedl-0912/test_media.py
          UDL_FREEDL_TEST_BINARY="$RUNNER_TEMP/freedl-validation/udl" python .dev/freedl-0912/test_native_promotion.py
          go test ./internal/mediametadata ./internal/freedl -count=1
